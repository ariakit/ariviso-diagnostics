name: Visonaut synthetic capture executor

on:
  workflow_call:
    secrets:
      VISONAUT_PLAYWRIGHT_TARBALL_URL:
        required: true
      VISONAUT_CLI_TARBALL_URL:
        required: true

permissions:
  contents: read

env:
  VISONAUT_EXECUTOR_SOURCE: "4c16e466025df6553dae4e512e1fe1225d5bd58e"

jobs:
  capture:
    name: chromium-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      VISONAUT_SHARD: ${{ matrix.shard }}
      VISONAUT_SERVER: https://diagnostics.visonaut.com
    steps:
      - name: Read the immutable executor files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ariakit/visonaut-diagnostics
          ref: ${{ env.VISONAUT_EXECUTOR_SOURCE }}
          path: .visonaut-trusted
          sparse-checkout: .github/visonaut
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - name: Install the fixed capture harness
        run: |
          rm -rf visonaut-harness .visonaut-results .visonaut-test-results
          mkdir visonaut-harness
          cp -R .visonaut-trusted/.github/visonaut/. visonaut-harness/
      - run: npm ci --ignore-scripts --audit=false --fund=false
        working-directory: visonaut-harness
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: visonaut-harness
      - name: Install the two reviewed client tarballs
        env:
          VISONAUT_PLAYWRIGHT_TARBALL_URL: ${{ secrets.VISONAUT_PLAYWRIGHT_TARBALL_URL }}
          VISONAUT_CLI_TARBALL_URL: ${{ secrets.VISONAUT_CLI_TARBALL_URL }}
        run: node visonaut-harness/install.mjs
      - name: Measure the actual environment
        run: node visonaut-harness/environment.mjs
      - name: Bind the signed job and fetch only the tested synthetic scenario
        env:
          GH_TOKEN: ${{ github.token }}
        run: node visonaut-harness/context.mjs
      - name: Run the full fixed shard
        run: node visonaut-harness/node_modules/@playwright/test/cli.js test --config visonaut-harness/playwright.config.mjs
      - name: Submit the complete shard
        run: |
          export PATH="$GITHUB_WORKSPACE/visonaut-harness/node_modules/.bin:$PATH"
          visonaut upload --manifest .visonaut-results/manifest.json
          visonaut finalize --manifest .visonaut-results/manifest.json
      - name: Read the manifest-bound receipt
        id: receipt
        run: node visonaut-harness/receipt.mjs
      - name: Bind the successful job to independent artifact metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.receipt.outputs.name }}
          path: .visonaut-results/receipt.json
          overwrite: false
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
