name: Ariviso runner profile probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    name: chromium-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      ARIVISO_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - run: npm ci --ignore-scripts --audit=false --fund=false
        working-directory: .github/ariviso
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: .github/ariviso
      - name: Measure the actual synthetic capture environment
        run: node .github/ariviso/environment.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ariviso-environment-chromium-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .ariviso-results/environment-chromium-${{ matrix.shard }}.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
